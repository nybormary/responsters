# UI tests on every pull request (RSP-127). How it works and how to read the result: docs/testing.md, "CI".
#
# PR changes site/ or netlify/ → Netlify builds a deploy preview → wait until Netlify reports it ready for
#   this exact commit → run the suite against the preview (variant 8) and report the run to testomat.io.
# PR changes nothing there → Netlify skips the preview (the `ignore` rule in netlify.toml) → run the suite
#   on the PR's own files inside CI (variant 1). Not reported to testomat.io: it isn't a deployed site.
# PR changes the site, but this push only tests or docs → Netlify compares with its LAST BUILT preview, not with
#   master, and cancels this commit's preview → also variant 1 on the PR's own files (RSP-174).
# Either way: type check, locale check, lint, format check, and the HTML report kept as an artifact for 14 days.
# A failed run posts one alert to Slack #ci-alerts (RSP-179, scripts/ci-alert.mjs); a green run posts nothing.

name: UI tests

on:
  pull_request:
    branches: [master]

# A new push to the same PR stops the run that is still going.
concurrency:
  group: ui-tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read # Netlify's deploy preview status on the commit
  checks: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history, to compare the PR with master

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        id: typecheck
        run: npm run typecheck

      - name: Locale check
        id: locales
        run: npm run check-locales

      - name: Lint
        id: lint
        run: npm run lint

      - name: Format check
        id: format
        run: npm run format:check

      - name: Does this PR change the site?
        id: changes
        # Same paths as the `ignore` rule in netlify.toml: only these get a deploy preview.
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- site/ netlify/ scripts/build-pages.mjs netlify.toml; then
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "No change to the site or its build: no deploy preview, tests run on the PR's own files."
          else
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "The site or its build changed: tests run on the deploy preview of PR #$PR_NUMBER."
          fi

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Wait for the Netlify deploy preview of this commit
        id: preview
        if: steps.changes.outputs.site == 'true'
        # An older preview of the same PR also answers 200, so a plain URL check could test the wrong build.
        # Netlify reports each commit's preview as a commit status `netlify/responsters/deploy-preview`.
        # Wait for "success" with "ready" in its text on this commit. A skipped build is ALSO "success",
        # but its text is "Deploy Preview canceled." (seen on the RSP-127 PR): that must not count as a preview.
        # Netlify cancels when nothing in the site changed since its last built preview (e.g. a push with only
        # tests or docs, RSP-174): then the tests run on the PR's own files below. Up to 10 minutes.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
              --jq '[.statuses[] | select(.context | test("deploy-preview"))][0] // {} | "\(.state // "none")|\(.description // "")"')
            state="${status%%|*}"; text="${status#*|}"
            echo "Check $i: Netlify deploy preview = $state ($text)"
            case "$state" in
              success)
                case "$text" in
                  *[Rr]eady*) echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
                  *[Cc]anceled*)
                    echo "ready=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::Netlify skipped this commit's preview ($text): nothing in the site changed since its last built preview. The tests run on the PR's own files (variant 1, not reported)."
                    exit 0 ;;
                  *) echo "::error::Netlify did not build a deploy preview for this commit ($text), although site/ or netlify/ changed."; exit 1 ;;
                esac ;;
              failure|error) echo "::error::Netlify could not build the deploy preview of this commit ($text)."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::No ready deploy preview after 10 minutes. Statuses seen on this commit:"
          gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '.statuses[] | "\(.context): \(.state)"'
          exit 1

      - name: UI tests on the deploy preview (variant 8, reported to testomat.io)
        id: tests-preview
        if: steps.preview.outputs.ready == 'true'
        env:
          TARGET: preview
          PR: ${{ github.event.pull_request.number }}
          TESTOMATIO: ${{ secrets.TESTOMATIO }}
          BRANCH: ${{ github.head_ref }}
        run: |
          export TESTOMATIO_TITLE="🦭 CI · PR #$PR ($BRANCH) on deploy preview"
          npx playwright test 2>&1 | tee testomat-run.log # the alert takes the run link from this log

      - name: UI tests on the PR's own files (variant 1, not reported)
        id: tests-own
        if: steps.changes.outputs.site == 'false' || steps.preview.outputs.ready == 'false'
        run: npx playwright test

      - name: Keep the HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Alert #ci-alerts
        if: failure()
        continue-on-error: true # best effort: Slack down or no secret must not change the result
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALERT_KIND: pr
          STEPS_JSON: ${{ toJSON(steps) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BRANCH: ${{ github.head_ref }}
          SUITE_WAY: ${{ steps.preview.outputs.ready == 'true' && 'the deploy preview' || 'the PR''s own files' }}
        run: node scripts/ci-alert.mjs
