# RSP-90, RSP-138: the build copies site/ to dist/ and writes, per language, the HTTP rubric page (/<lang>/http/)
# and the creature pages (/<lang>/http/<code>/); also the chooser pages for links without a language,
# dist/_redirects (302 to the visitor's language by the nf_lang cookie or the browser language) and sitemap.xml.
# No npm packages are needed for it: plain Node. The ignore rule skips a deploy when nothing that ends up
# in dist/ changed: site/, the page build, or this file.
[build]
  command = "node scripts/build-pages.mjs"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify/ scripts/build-pages.mjs netlify.toml"

# Redirects: all in dist/_redirects, written by the build (RSP-148). Netlify reads that file before any
# [[redirects]] here, so the old ones moved there, first: the old Netlify address → https://mnemozoo.com keeping the
# path (RSP-136; only that exact host, deploy previews are not redirected) and /security.txt →
# /.well-known/security.txt (RSP-137, RFC 9116).
