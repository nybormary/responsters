<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 573" role="img" aria-label="На стіні портрет двох котів, сірого й світлого, що обнюхуються ніс до носа. Ліворуч у відчинені вхідні двері заходить усміхнена людина з коробкою з жовтою наліпкою; ще кілька таких коробок уже стоять у кімнаті. Праворуч господар тримає руку біля підборіддя й дивиться на стільницю, де поруч стоять два однакові чайники, його світлий і жовтий новоприбулого; між ними знак питання. На полиці над стільницею його власні коробки без наліпок."><rect width="640" height="573" fill="#F4E6C8"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M18 501Q109 500 200 502Q310 501 420 501Q521 499 621 502" fill="none" stroke="#2B211A" stroke-width="4.5"/><path d="M22 501L22 206Q78 202 134 206L134 501" fill="none" stroke="#2B211A" stroke-width="6"/><path d="M30 501L30 216Q78 213 126 216L126 501" fill="none" stroke="#2B211A" stroke-width="2.5"/><path d="M134 206L166 192L166 512L134 501Z" fill="#F4E6C8" stroke="#2B211A" stroke-width="5"/><ellipse cx="158" cy="352" rx="3.5" ry="5.5" fill="#2B211A"/><path d="M108 300C108 313.2 98.4 324 84 324C69.6 324 60 313.2 60 300C60 285.6 70.8 276 84 276C98.4 276 108 286.8 108 300Z" fill="#F4E6C8" stroke="#2B211A" stroke-width="5"/><circle cx="94" cy="296" r="3.2" fill="#2B211A"/><circle cx="106" cy="296" r="3.2" fill="#2B211A"/><path d="M92 312q7 5 14 0" fill="none" stroke="#2B211A" stroke-width="3"/><path d="M84 324Q84 374 84 416" fill="none" stroke="#2B211A" stroke-width="5"/><path d="M84 344Q108 352 124 364M84 344Q104 360 120 380" fill="none" stroke="#2B211A" stroke-width="5"/><path d="M112 388Q111 364.0 112 340Q142.0 339 172 340Q173 364.0 172 388Q142.0 389 112 388Z" fill="#FBF3E2" stroke="#2B211A" stroke-width="4"/><path d="M142.0 340l0 15.36" fill="none" stroke="#2B211A" stroke-width="3"/><path d="M129.4 363.04l25.2 0 0 12.48-25.2 0z" fill="#EFE05A" stroke="#2B211A" stroke-width="3"/><path d="M84 416Q74 456 66 498M84 416Q96 456 104 498" fill="none" stroke=