<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Responsters: original creatures for memorizing HTTP status codes, with a practice deck and drills for codes that are easy to confuse."
    />
    <title>Responsters</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;700&family=JetBrains+Mono:wght@600;800&display=swap"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/collection.css" />
    <link rel="stylesheet" href="css/practice.css" />
    <link rel="stylesheet" href="css/traps.css" />
    <link rel="stylesheet" href="css/detail.css" />
  </head>
  <body>
    <div class="wrap" id="top">
      <header>
        <div class="brand">
          <h1><a class="home-link" href="#collection">Responsters</a></h1>
          <p id="tagline"></p>
          <div class="dots" aria-hidden="true">
            <i style="background: var(--c1)"></i><i style="background: var(--c2)"></i
            ><i style="background: var(--c3)"></i><i style="background: var(--c4)"></i
            ><i style="background: var(--c5)"></i>
          </div>
        </div>
        <div class="tools">
          <button class="linkbtn" id="howto-open" data-testid="howto-open" aria-controls="howto"></button>
          <div class="langmenu" id="langmenu">
            <button
              class="langbtn"
              id="lang-btn"
              data-testid="lang-button"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="lang-list"
            ></button>
            <ul class="langlist" id="lang-list" data-testid="lang-menu" role="menu" hidden></ul>
          </div>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button role="tab" id="tab-collection" data-testid="tab-collection" data-view="collection"></button>
        <button role="tab" id="tab-practice" data-testid="tab-practice" data-view="practice"></button>
        <button role="tab" id="tab-traps" data-testid="tab-traps" data-view="traps"></button>
      </nav>

      <section class="howto" id="howto" data-testid="howto" aria-labelledby="howto-title" hidden>
        <h2 id="howto-title"></h2>
        <ol id="howto-steps"></ol>
        <p class="note" id="howto-note"></p>
        <button class="howto-done" id="howto-close" data-testid="howto-close"></button>
      </section>

      <section class="view" id="view-collection" data-testid="view-collection">
        <div class="progress">
          <span id="mastered"></span>
          <div class="bar"><span id="masterbar"></span></div>
        </div>
        <div class="chips" id="chips"></div>
        <div id="groups"></div>
      </section>

      <section class="view" id="view-practice" data-testid="view-practice" hidden>
        <div class="pbar">
          <h2 class="pbar-title" id="modes-title"></h2>
          <div class="score" id="score"></div>
          <div class="modes" id="modes" role="group" aria-labelledby="modes-title"></div>
        </div>
        <div class="stage" id="stage">
          <div class="prompt" id="prompt"></div>
          <div class="opts" id="opts"></div>
          <div id="result"></div>
        </div>
      </section>

      <section class="view" id="view-traps" data-testid="view-traps" hidden>
        <p id="traps-lede" style="margin: 0 0 18px; color: var(--muted); max-width: 65ch"></p>
        <div id="pairs"></div>
      </section>

      <button class="linkbtn to-top" id="to-top" data-testid="to-top" type="button"></button>
      <footer id="foot"></footer>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
