<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Responsters: original creatures for memorizing HTTP status codes, with a practice deck and drills for codes that are easy to confuse.">
<title>Responsters</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
/* Layout: a field guide. Header with tabs → collection grouped by status class, practice deck, and confusable pairs. Card art is the hero; the UI stays quiet around it. */
:root{
  --bg:#F3F1F7; --surface:#FFFFFF; --ink:#33202F; --muted:#6E6176; --line:#E1DCE8; --soft:#E9E5F0;
  --accent:#5A3352; --good:#2E9D6B; --bad:#D2554A;
  --c1:#9B8BE8; --c2:#4FC38F; --c3:#78B6E2; --c4:#F2A15A; --c5:#EE776B;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18131C; --surface:#231C29; --ink:#F2ECF4; --muted:#ABA0B3; --line:#3A3042; --soft:#2E2535;
  --accent:#E7B8DB; --good:#5DD29C; --bad:#F07F74; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#18131C; --surface:#231C29; --ink:#F2ECF4; --muted:#ABA0B3; --line:#3A3042; --soft:#2E2535;
  --accent:#E7B8DB; --good:#5DD29C; --bad:#F07F74; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; margin:0}
.wrap{max-width:1120px; margin:0 auto; padding-inline:16px; padding-block:24px 56px}
header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px}
.brand h1{font-family:var(--display); font-weight:800; font-size:clamp(40px,8vw,64px); line-height:.95; margin:0; letter-spacing:-.01em; color:var(--accent)}
.brand p{margin:6px 0 0; color:var(--muted); max-width:46ch}
.brand .dots{display:flex; gap:6px; margin-top:12px}
.brand .dots i{width:28px; height:8px; border-radius:4px; display:block}
.lang{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface)}
.lang button{border:0; background:none; color:var(--muted); font:700 13px var(--body); padding:7px 12px; cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent); color:var(--bg)}
nav.tabs{display:flex; gap:6px; margin-top:24px; border-bottom:2px solid var(--line); overflow-x:auto}
nav.tabs button{border:0; background:none; font:700 17px var(--display); color:var(--muted); padding:8px 14px 6px; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink); border-color:var(--accent)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
section.view{padding-top:24px}
.progress{display:flex; align-items:center; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:14px}
.bar{flex:1 1 180px; max-width:320px; height:8px; background:var(--soft); border-radius:4px; overflow:hidden}
.bar span{display:block; height:100%; background:var(--good); width:0; transition:width .4s}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 8px}
.chip{border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:5px 12px; font:700 14px var(--body); cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.chip i{width:10px; height:10px; border-radius:50%; display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--soft)}
.group{margin-top:28px}
.group h2{font:800 22px var(--display); margin:0 0 2px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.group h2 code{font:800 15px var(--mono); padding:2px 8px; border-radius:6px; color:#2B1A28}
.group p.lede{margin:0 0 12px; color:var(--muted); font-size:14px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.card{position:relative; border:0; padding:0; background:none; cursor:pointer; border-radius:16px; transition:transform .15s}
.card img{width:100%; aspect-ratio:1536/2752; display:block; border-radius:16px; box-shadow:0 2px 10px rgb(40 20 40 / .14)}
.card:hover{transform:translateY(-3px)}
/* "Known" mark: a small check on the card corner, clear of the title painted into the art. The word lives in the button's aria-label. */
.card .badge{position:absolute; top:-7px; right:-7px; width:28px; height:28px; display:grid; place-items:center; background:#1E7A50; color:#fff; font:800 15px/1 var(--body); border:3px solid var(--bg); border-radius:50%; pointer-events:none}
/* practice */
.pbar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between}
.seg{display:inline-flex; background:var(--soft); border-radius:10px; padding:3px}
.seg button{border:0; background:none; color:var(--muted); font:700 14px var(--body); padding:7px 12px; border-radius:8px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.score{font:600 14px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
.stage{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; margin-top:20px; align-items:start}
@media (max-width:760px){.stage{grid-template-columns:minmax(0,1fr)}}
.prompt{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center}
.prompt .q{font:700 15px var(--body); color:var(--muted)}
.prompt img.art{width:100%; max-width:440px; border-radius:14px; aspect-ratio:640/573; object-fit:cover}
.bigcode{font:800 clamp(56px,12vw,96px)/1 var(--mono); letter-spacing:-.03em; color:var(--ink)}
.bigstatus{font:700 20px var(--display)}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opt{border:2px solid var(--line); background:var(--surface); color:var(--ink); border-radius:14px; padding:12px; cursor:pointer; text-align:left; font:700 15px var(--body); display:flex; flex-direction:column; gap:2px; min-width:0}
.opt b{font:800 22px var(--mono)}
.opt span{color:var(--muted); font-weight:400; font-size:13px}
.opt img{width:100%; border-radius:10px; aspect-ratio:640/573; object-fit:cover}
.opt.imgopt{padding:6px; gap:6px}
.opt .nm{font:800 16px var(--display); color:var(--ink); text-align:center; padding-bottom:2px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good); background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default}
.reveal{display:flex; gap:16px; align-items:flex-start; margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:14px}
.reveal img{width:130px; flex:none; border-radius:12px}
.reveal .txt{min-width:0}
.verdict{font:800 20px var(--display); margin:0}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.reveal p{margin:4px 0 0; font-size:15px}
.next{margin-top:12px; border:0; background:var(--accent); color:var(--bg); font:700 16px var(--body); padding:10px 18px; border-radius:12px; cursor:pointer}
/* traps */
.pair{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:18px}
.pair h3{font:800 20px var(--display); margin:0 0 4px}
.pair .rule{margin:0 0 12px; color:var(--muted)}
.duo{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,160px)); gap:12px}
.duo button{border:0; padding:0; background:none; cursor:pointer}
.duo img{width:100%; border-radius:12px; box-shadow:0 2px 8px rgb(40 20 40 / .12)}
.scen{margin-top:14px; display:flex; flex-direction:column; gap:10px}
.sc{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:10px 12px; border-radius:12px; background:var(--soft)}
.sc p{margin:0; flex:1 1 220px; min-width:0}
.sc .btns{display:flex; gap:6px; flex-wrap:wrap}
.sc button{border:2px solid var(--line); background:var(--surface); color:var(--ink); font:800 14px var(--mono); border-radius:9px; padding:5px 10px; cursor:pointer}
.sc button.right{border-color:var(--good); color:var(--good)}
.sc button.wrong{border-color:var(--bad); color:var(--bad)}
.sc .why{flex-basis:100%; font-size:14px; color:var(--muted)}
/* modal */
.modal{position:fixed; inset:0; background:var(--bg); display:flex; align-items:flex-start; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top, 0px)); overflow:auto; z-index:10}
.modal .sheet{margin-block:auto}
.sheet{background:var(--surface); border-radius:22px; max-width:520px; width:100%; border:1px solid var(--line); padding:0 0 20px; position:relative; border-top:10px solid var(--cls)}
.sheet .in{padding:20px 22px 0}
.back{margin:20px 22px 0; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font:700 15px var(--body); padding:9px 16px; border-radius:12px; cursor:pointer}
.sheet h3{font:800 28px var(--display); margin:0}
.sheet .st{font:800 18px var(--mono); margin:0 40px 0 0}
.sheet .mv{display:inline-block; margin-top:6px; font:700 14px var(--body); background:var(--soft); padding:3px 10px; border-radius:999px}
.sheet h4{font:700 13px var(--body); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 0 4px}
.sheet p{margin:0}
.qa{margin:4px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:4px}
.qa li::marker{color:var(--accent)}
.close{position:absolute; top:10px; right:10px; border:0; background:var(--soft); color:var(--ink); width:36px; height:36px; border-radius:50%; font-size:20px; cursor:pointer}
.mini{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.mini button{border:1.5px solid var(--line); background:var(--bg); color:var(--ink); border-radius:999px; padding:4px 10px; font:700 13px var(--body); cursor:pointer}
footer{margin-top:40px; color:var(--muted); font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Responsters</h1>
      <p id="tagline"></p>
      <div class="dots" aria-hidden="true"><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i><i style="background:var(--c4)"></i><i style="background:var(--c5)"></i></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-uk" data-lang="uk">UA</button><button id="lang-en" data-lang="en">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-collection" data-view="collection"></button>
    <button role="tab" id="tab-practice" data-view="practice"></button>
    <button role="tab" id="tab-traps" data-view="traps"></button>
  </nav>

  <section class="view" id="view-collection">
    <div class="progress"><span id="mastered"></span><div class="bar"><span id="masterbar"></span></div></div>
    <div class="chips" id="chips"></div>
    <div id="groups"></div>
  </section>

  <section class="view" id="view-practice" hidden>
    <div class="pbar">
      <div class="seg" role="group">
        <button id="mode-art" data-mode="art"></button>
        <button id="mode-code" data-mode="code"></button>
      </div>
      <div class="score" id="score"></div>
    </div>
    <div class="stage">
      <div class="prompt" id="prompt"></div>
      <div>
        <div class="opts" id="opts"></div>
        <div id="result"></div>
      </div>
    </div>
  </section>

  <section class="view" id="view-traps" hidden>
    <p id="traps-lede" style="margin:0 0 18px; color:var(--muted); max-width:65ch"></p>
    <div id="pairs"></div>
  </section>

  <footer id="foot"></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <button class="close" id="m-close" aria-label="Close">×</button>
    <div class="in">
      <p class="st" id="m-status"></p>
      <h3 id="m-name"></h3>
      <h4 id="m-h-move"></h4><p id="m-move"></p>
      <h4 id="m-h-mean"></h4><p id="m-mean"></p>
      <h4 id="m-h-when"></h4><p id="m-when"></p>
      <h4 id="m-h-qa"></h4><ul class="qa" id="m-qa"></ul>
      <div id="m-conf-wrap"><h4 id="m-h-conf"></h4><div class="mini" id="m-conf"></div></div>
    </div>
    <button class="back" id="m-back"></button>
  </div>
</div>

<script>
const CLS = {
  1:{c:'var(--c1)', uk:['Яйця','Ще вилуплюються: сервер отримав запит і працює.'], en:['Eggs','Still hatching: the server got the request and is working on it.']},
  2:{c:'var(--c2)', uk:['Друзі','Усе вдалося.'], en:['Friends','It worked.']},
  3:{c:'var(--c3)', uk:['Мандрівники','Те, що ти шукаєш, деінде.'], en:['Wanderers','What you want is somewhere else.']},
  4:{c:'var(--c4)', uk:['Вартові','Помилка з боку клієнта: виправ запит.'], en:['Gatekeepers','Client error: fix the request.']},
  5:{c:'var(--c5)', uk:['Серверні звірі','Помилка на сервері: ти не винна.'], en:['Server beasts','Server error: not your fault.']}
};
const D = [
 {c:102,s:'Processing',n:'Loadlet',m:'Spin Up',
  uk:['Сервер прийняв запит і ще обробляє його. Відповіді поки немає.','Довгі операції у WebDAV; у звичайних API зустрічається рідко.'],
  en:['The server accepted the request and is still working on it. No response yet.','Long WebDAV operations; rare in everyday APIs.']},
 {c:200,s:'OK',n:'Okayak',m:'Nod',
  uk:['Запит успішний, у відповіді є результат.','GET сторінки чи списку, успішний POST без створення ресурсу.'],
  en:['The request succeeded and the response carries the result.','GET of a page or list, a POST that did not create a resource.']},
 {c:201,s:'Created',n:'Buildbeaver',m:'Build',
  uk:['Створено новий ресурс. Його адреса в заголовку Location.','POST /orders створив замовлення.'],
  en:['A new resource was created. Its address is in the Location header.','POST /orders created an order.']},
 {c:204,s:'No Content',n:'Nullwing',m:'Munch',
  uk:['Успіх, але тіла відповіді немає.','DELETE або PUT, після яких нічого повертати.'],
  en:['Success, but there is no response body.','DELETE or PUT with nothing to return.']},
 {c:301,s:'Moved Permanently',n:'Relocrab',m:'New Shell',
  uk:['Ресурс назавжди переїхав. Клієнти й пошуковики мають оновити адресу.','Перехід зі старого домену чи з http на https.'],
  en:['The resource moved for good. Clients and search engines should update the URL.','Moving to a new domain, or http to https.']},
 {c:302,s:'Found',n:'Brbat',m:'Back Soon',
  uk:['Ресурс тимчасово за іншою адресою. Стара адреса лишається правильною.','Редірект після логіну, тимчасова сторінка акції.'],
  en:['The resource is temporarily elsewhere. The original URL stays correct.','Redirect after login, a temporary promo page.']},
 {c:304,s:'Not Modified',n:'Cachameleon',m:'Snapshot',
  uk:['Ресурс не змінився з часу кешування. Бери свою копію.','Браузер надіслав If-None-Match чи If-Modified-Since.'],
  en:['Nothing changed since you cached it. Use your copy.','The browser sent If-None-Match or If-Modified-Since.']},
 {c:400,s:'Bad Request',n:'Garblin',m:'Parse Fail',
  uk:['Запит некоректний: синтаксис, формат або невалідні дані.','Зламаний JSON, пропущене обов’язкове поле, некоректні query-параметри, обірване тіло запиту.'],
  en:['The request is malformed: syntax, format or invalid data.','Broken JSON, a missing required field, invalid query parameters, a request body cut off halfway.']},
 {c:401,s:'Unauthorized',n:'Whoowl',m:'Who Goes There',
  uk:['Потрібна автентифікація: облікових даних немає або вони невалідні.','Немає заголовка Authorization, прострочений токен.'],
  en:['Authentication is required: credentials are missing or invalid.','No Authorization header, an expired token.']},
 {c:403,s:'Forbidden',n:'Nopelican',m:'Hard No',
  uk:['Хто ти, відомо, але прав доступу немає.','Звичайний користувач відкриває адмінку.'],
  en:['Your identity is known, but you lack permission.','A regular user opens the admin panel.']},
 {c:404,s:'Not Found',n:'Nowherret',m:'Vanish',
  uk:['За цією адресою нічого немає.','Опечатка в URL, видалений товар.'],
  en:['Nothing exists at this address.','A typo in the URL, a deleted product.']},
 {c:405,s:'Method Not Allowed',n:'Verbadger',m:'Wrong Verb',
  uk:['Сервер знає цю адресу, але не приймає цей метод.','DELETE на ендпоінт, який приймає лише GET.'],
  en:['The server knows this address but doesn’t accept this method.','A DELETE sent to an endpoint that only accepts GET.']},
 {c:408,s:'Request Timeout',n:'Slowth',m:'Five More Minutes',
  uk:['Клієнт надсилав запит надто довго, і сервер перестав чекати.','Повільне з’єднання, завислий upload.'],
  en:['The client took too long to send the request, so the server stopped waiting.','A slow connection, a stalled upload.']},
 {c:409,s:'Conflict',n:'Clashgoat',m:'Horn Lock',
  uk:['Запит конфліктує з поточним станом ресурсу.','Зайнятий email при реєстрації, конфлікт версій при редагуванні.'],
  en:['The request conflicts with the current state of the resource.','An email that’s already taken at sign-up, a version conflict while editing.']},
 {c:413,s:'Content Too Large',n:'Megabite',m:'Overstuff',
  uk:['Тіло запиту більше за дозволений ліміт.','Завеликий файл при завантаженні.'],
  en:['The request body is larger than the allowed limit.','Uploading a file that’s too big.']},
 {c:415,s:'Unsupported Media Type',n:'Pickoala',m:'Picky Eater',
  uk:['Сервер не підтримує цей формат даних.','XML замість JSON, неправильний Content-Type.'],
  en:['The server doesn’t support this data format.','XML instead of JSON, a wrong Content-Type.']},
 {c:418,s:"I'm a teapot",n:'Teapotamus',m:'Steep',
  uk:['Жартівливий код з RFC 2324: чайник відмовляється варити каву.','Великодні яйця в API. На співбесіді — гарний бонус.'],
  en:['A joke code from RFC 2324: a teapot refuses to brew coffee.','Easter eggs in APIs. A nice bonus in an interview.']},
 {c:422,s:'Unprocessable Content',n:'Nitpecker',m:'Validation Peck',
  uk:['Запит прочитано, але дані не проходять валідацію.','Рядок замість числа, від’ємний вік, «email: banana».'],
  en:['The request was read, but the data fails validation.','A string instead of a number, a negative age, “email: banana”.']},
 {c:429,s:'Too Many Requests',n:'Spamster',m:'Wheel Spin',
  uk:['Забагато запитів за короткий час, спрацював rate limit.','Скрипт без пауз, заголовок Retry-After у відповіді.'],
  en:['Too many requests in a short time; a rate limit kicked in.','A script without pauses, a Retry-After header in the response.']},
 {c:500,s:'Internal Server Error',n:'Panicorn',m:'Stack Trace',
  uk:['На сервері сталася неочікувана помилка.','Необроблений виняток у коді бекенду.'],
  en:['Something unexpected broke on the server.','An unhandled exception in backend code.']},
 {c:502,s:'Bad Gateway',n:'Parroxy',m:'Broken Telephone',
  uk:['Шлюз або проксі отримав невалідну відповідь від сервера за ним.','Nginx перед бекендом, який упав.'],
  en:['A gateway or proxy got an invalid response from the server behind it.','Nginx in front of a backend that crashed.']},
 {c:503,s:'Service Unavailable',n:'Hibearnate',m:'Maintenance Window',
  uk:['Сервер тимчасово недоступний: перевантаження або обслуговування.','Планові роботи, сервер перевантажений.'],
  en:['The server is temporarily unavailable: overload or maintenance.','Planned maintenance, an overloaded server.']},
 {c:504,s:'Gateway Timeout',n:'Waitgator',m:'Long Wait',
  uk:['Шлюз або проксі не дочекався відповіді від сервера за ним.','Повільний бекенд за nginx чи CDN.'],

  $('m-h-mean').textContent = t().mean; $('m-mean').textContent = L[0];
  $('m-h-when').textContent = t().when; $('m-when').textContent = L[1];
  $('m-h-qa').textContent = t().qa; $('m-qa').innerHTML = (QA[c]?QA[c][lang]:[]).map(x=>`<li>${x.replace(/</g,'&lt;')}</li>`).join('');
  const cf = CONF[c]||[]; $('m-conf-wrap').hidden = !cf.length; $('m-h-conf').textContent = t().conf;
  $('m-conf').innerHTML = cf.map(x=>`<button data-open="${x}">${x} ${BY[x].n}</button>`).join('');
  $('modal').hidden = false; $('m-close').focus();
}
function closeModal(){ $('modal').hidden = true; }

function pick(){
  const pool = D.filter(d=>d.c!==last);
  const ws = pool.map(d=>weight[d.c]||1), sum = ws.reduce((a,b)=>a+b,0);
  let r = Math.random()*sum;
  for(let i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
function distractors(d){
  const conf = (CONF[d.c]||[]).map(c=>BY[c]);
  const same = D.filter(x=>cls(x.c)===cls(d.c) && x.c!==d.c && !conf.includes(x));
  const other = D.filter(x=>cls(x.c)!==cls(d.c) && !conf.includes(x));
  const sh = a => a.sort(()=>Math.random()-.5);
  return sh([...sh(conf), ...sh(same), ...sh(other)].slice(0,3).concat(d));
}
function newRound(){ cur = pick(); last = cur.c; cur.opts = distractors(cur); cur.done = false; renderPractice(); }
function renderPractice(){
  if(!cur) return newRound();
  $('score').textContent = t().score(stats.r, stats.t, stats.s);
  const d = cur;
  $('prompt').innerHTML = mode==='art'
    ? `<div class="q">${t().qArt}</div><img class="art" src="${art(d.c)}" alt="">`
    : `<div class="q">${t().qCode}</div><div class="bigcode">${d.c}</div><div class="bigstatus">${d.s}</div>`;
  $('opts').innerHTML = d.opts.map(o=>{
    const st = d.done ? (o.c===d.c?'right':(o.c===d.pick?'wrong':'')) : '';
    return mode==='art'
      ? `<button class="opt ${st}" data-ans="${o.c}" ${d.done?'disabled':''}><b>${o.c}</b><span>${o.s}</span></button>`
      : `<button class="opt imgopt ${st}" data-ans="${o.c}" ${d.done?'disabled':''} aria-label="${o.n}"><img src="${art(o.c)}" alt=""><span class="nm">${o.n}</span></button>`;
  }).join('');
  $('result').innerHTML = d.done ? `<div class="reveal"><img src="${img(d.c)}" alt="${d.c} ${d.n}"><div class="txt">
     <p class="verdict ${d.pick===d.c?'ok':'no'}">${d.pick===d.c?t().ok:t().no}</p>
     <p><b>${d.c} ${d.s}</b> · ${d.n}</p><p>${d[lang][0]}</p>
     <button class="next" id="next">${t().next} →</button></div></div>` : '';
}
function answer(c){
  if(cur.done) return;
  cur.done = true; cur.pick = c; stats.t++;
  if(c===cur.c){ stats.r++; stats.s++; weight[cur.c]=Math.max(1,(weight[cur.c]||1)-1); streakBy[cur.c]=(streakBy[cur.c]||0)+1; }
  else { stats.s=0; weight[cur.c]=(weight[cur.c]||1)+2; streakBy[cur.c]=0; }
  store.set('weight',weight); store.set('streak',streakBy);
  renderPractice(); const n=$('next'); if(n) n.focus();
}
function renderTraps(){
  $('pairs').innerHTML = PAIRS.map((p,pi)=>`<div class="pair"><h3>${p[lang][0]}</h3><p class="rule">${p[lang][1]}</p>
    <div class="duo">${p.codes.map(c=>`<button data-open="${c}" aria-label="${c} ${BY[c].n}"><img src="${img(c)}" alt="" loading="lazy"></button>`).join('')}</div>
    <div class="scen">${p.s.map((s,si)=>`<div class="sc" id="sc-${pi}-${si}"><p>${lang==='uk'?s[1]:s[2]}</p><div class="btns">${p.codes.map(c=>`<button data-sc="${pi}-${si}" data-v="${c}">${c}</button>`).join('')}</div></div>`).join('')}</div></div>`).join('');
}
function scAnswer(key, v){
  const [pi,si] = key.split('-').map(Number), s = PAIRS[pi].s[si], box = $('sc-'+key);
  box.querySelectorAll('button').forEach(b=>{ const c=+b.dataset.v; b.disabled=true; if(c===s[0]) b.classList.add('right'); else if(c===v) b.classList.add('wrong'); });
  const why = document.createElement('div'); why.className='why';
  why.textContent = `${v===s[0]?'✓':'✗'} ${s[0]} ${BY[s[0]].n}: ${BY[s[0]][lang][0]}`;
  box.appendChild(why);
}
function render(){ renderChrome(); if(view==='collection') renderCollection(); if(view==='practice') renderPractice(); if(view==='traps') renderTraps(); }

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b){ if(e.target.id==='modal') closeModal(); return; }
  if(b.dataset.lang){ lang=b.dataset.lang; store.set('lang',lang); render(); }
  else if(b.dataset.view){ view=b.dataset.view; render(); }
  else if(b.dataset.f!=null){ filter=+b.dataset.f; renderCollection(); }
  else if(b.dataset.mode){ mode=b.dataset.mode; renderChrome(); newRound(); }
  else if(b.dataset.ans){ answer(+b.dataset.ans); }
  else if(b.id==='next'){ newRound(); }
  else if(b.dataset.sc){ scAnswer(b.dataset.sc, +b.dataset.v); }
  else if(b.dataset.open){ openCard(+b.dataset.open); }
  else if(b.id==='m-close' || b.id==='m-back'){ closeModal(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('modal').hidden) closeModal(); });
const h = location.hash.slice(1); if(['collection','practice','traps'].includes(h)) view = h;
render();
</script>
