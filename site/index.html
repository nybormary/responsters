<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Responsters: original creatures for memorizing HTTP status codes, with a practice deck and drills for codes that are easy to confuse.">
<title>Responsters</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
/* Layout: a field guide. Header with tabs → collection grouped by status class, practice deck, and confusable pairs. Card art is the hero; the UI stays quiet around it. */
:root{
  --bg:#F3F1F7; --surface:#FFFFFF; --ink:#33202F; --muted:#6E6176; --line:#E1DCE8; --soft:#E9E5F0;
  --accent:#5A3352; --good:#2E9D6B; --bad:#D2554A;
  --c1:#9B8BE8; --c2:#4FC38F; --c3:#78B6E2; --c4:#F2A15A; --c5:#EE776B;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18131C; --surface:#231C29; --ink:#F2ECF4; --muted:#ABA0B3; --line:#3A3042; --soft:#2E2535;
  --accent:#E7B8DB; --good:#5DD29C; --bad:#F07F74; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#18131C; --surface:#231C29; --ink:#F2ECF4; --muted:#ABA0B3; --line:#3A3042; --soft:#2E2535;
  --accent:#E7B8DB; --good:#5DD29C; --bad:#F07F74; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; margin:0}
.wrap{max-width:1120px; margin:0 auto; padding-inline:16px; padding-block:24px 56px}
header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px}
.brand h1{font-family:var(--display); font-weight:800; font-size:clamp(40px,8vw,64px); line-height:.95; margin:0; letter-spacing:-.01em; color:var(--accent)}
.brand p{margin:6px 0 0; color:var(--muted); max-width:46ch}
.brand .dots{display:flex; gap:6px; margin-top:12px}
.brand .dots i{width:28px; height:8px; border-radius:4px; display:block}
.lang{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface)}
.lang button{border:0; background:none; color:var(--muted); font:700 13px var(--body); padding:7px 12px; cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent); color:var(--bg)}
/* "How to use": a link-style button in the header and a dismissable panel above the views (RSP-98). */
.tools{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.linkbtn{border:0; background:none; padding:7px 2px; color:var(--accent); font:700 14px var(--body); text-decoration:underline; text-underline-offset:3px; cursor:pointer}
.howto{margin-top:20px; background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:16px 20px; display:grid; gap:10px}
.howto h2{font:800 20px var(--display); margin:0}
.howto ol{margin:0; padding-left:1.4em; display:grid; gap:6px}
.howto .note{margin:0; color:var(--muted); font-size:14px}
.howto-done{justify-self:start; border:1.5px solid var(--line); background:var(--soft); color:var(--ink); border-radius:999px; padding:6px 16px; font:700 14px var(--body); cursor:pointer}
nav.tabs{display:flex; gap:6px; margin-top:24px; border-bottom:2px solid var(--line); overflow-x:auto}
nav.tabs button{border:0; background:none; font:700 17px var(--display); color:var(--muted); padding:8px 14px 6px; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink); border-color:var(--accent)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
section.view{padding-top:24px}
.progress{display:flex; align-items:center; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:14px}
.bar{flex:1 1 180px; max-width:320px; height:8px; background:var(--soft); border-radius:4px; overflow:hidden}
.bar span{display:block; height:100%; background:var(--good); width:0; transition:width .4s}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 8px}
.chip{border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:5px 12px; font:700 14px var(--body); cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.chip i{width:10px; height:10px; border-radius:50%; display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--soft)}
.group{margin-top:28px}
.group h2{font:800 22px var(--display); margin:0 0 2px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.group h2 code{font:800 15px var(--mono); padding:2px 8px; border-radius:6px; color:#2B1A28}
.group p.lede{margin:0 0 12px; color:var(--muted); font-size:14px}
/* Collection grid: 2 columns on phones; from 600px the same 3 columns in every class, cards capped at 240px (640px art stays sharp on retina), rows left-aligned with the class headings. */
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,240px)); gap:18px}}
.card{position:relative; border:0; padding:0; background:none; cursor:pointer; border-radius:16px; transition:transform .15s}
.card img{width:100%; aspect-ratio:1536/2752; display:block; border-radius:16px; box-shadow:0 2px 10px rgb(40 20 40 / .14)}
.card:hover{transform:translateY(-3px)}
/* "Known" mark: a small check on the card corner, clear of the title painted into the art. The word lives in the button's aria-label. */
.card .badge{position:absolute; top:-7px; right:-7px; width:28px; height:28px; display:grid; place-items:center; background:#1E7A50; color:#fff; font:800 15px/1 var(--body); border:3px solid var(--bg); border-radius:50%; pointer-events:none}
/* practice */
.pbar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between}
.seg{display:inline-flex; background:var(--soft); border-radius:10px; padding:3px}
.seg button{border:0; background:none; color:var(--muted); font:700 14px var(--body); padding:7px 12px; border-radius:8px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.score{font:600 14px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
.stage{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; margin-top:20px; align-items:start}
@media (max-width:760px){.stage{grid-template-columns:minmax(0,1fr)}}
.prompt{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center}
.prompt .q{font:700 15px var(--body); color:var(--muted)}
.prompt img.art{width:100%; max-width:440px; border-radius:14px; aspect-ratio:640/573; object-fit:cover}
.bigcode{font:800 clamp(56px,12vw,96px)/1 var(--mono); letter-spacing:-.03em; color:var(--ink)}
.bigstatus{font:700 20px var(--display)}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.opt{border:2px solid var(--line); background:var(--surface); color:var(--ink); border-radius:14px; padding:12px; cursor:pointer; text-align:left; font:700 15px var(--body); display:flex; flex-direction:column; gap:2px; min-width:0}
.opt b{font:800 22px var(--mono)}
.opt span{color:var(--muted); font-weight:400; font-size:13px}
.opt img{width:100%; border-radius:10px; aspect-ratio:640/573; object-fit:cover}
.opt.imgopt{padding:6px; gap:6px}
.opt .nm{font:800 16px var(--display); color:var(--ink); text-align:center; padding-bottom:2px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good); background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default}
.reveal{display:flex; gap:16px; align-items:flex-start; margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:14px}
.reveal img{width:130px; flex:none; border-radius:12px}
.reveal .txt{min-width:0}
.verdict{font:800 20px var(--display); margin:0}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.reveal p{margin:4px 0 0; font-size:15px}
.next{margin-top:12px; border:0; background:var(--accent); color:var(--bg); font:700 16px var(--body); padding:10px 18px; border-radius:12px; cursor:pointer}
/* traps */
.pair{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:18px}
.pair h3{font:800 20px var(--display); margin:0 0 4px}
.pair .rule{margin:0 0 12px; color:var(--muted)}
.duo{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,160px)); gap:12px}
.duo button{border:0; padding:0; background:none; cursor:pointer}
.duo img{width:100%; border-radius:12px; box-shadow:0 2px 8px rgb(40 20 40 / .12)}
.scen{margin-top:14px; display:flex; flex-direction:column; gap:10px}
.sc{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:10px 12px; border-radius:12px; background:var(--soft)}
.sc p{margin:0; flex:1 1 220px; min-width:0}
.sc .btns{display:flex; gap:6px; flex-wrap:wrap}
.sc button{border:2px solid var(--line); background:var(--surface); color:var(--ink); font:800 14px var(--mono); border-radius:9px; padding:5px 10px; cursor:pointer}
.sc button.right{border-color:var(--good); color:var(--good)}
.sc button.wrong{border-color:var(--bad); color:var(--bad)}
.sc .why{flex-basis:100%; font-size:14px; color:var(--muted)}
/* modal */
.modal{position:fixed; inset:0; background:var(--bg); display:flex; align-items:flex-start; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top, 0px)); overflow:auto; z-index:10}
.modal .sheet{margin-block:auto}
.sheet{background:var(--surface); border-radius:22px; max-width:520px; width:100%; border:1px solid var(--line); padding:0 0 20px; position:relative; border-top:10px solid var(--cls)}
.sheet .in{padding:20px 22px 0}
.back{margin:20px 22px 0; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font:700 15px var(--body); padding:9px 16px; border-radius:12px; cursor:pointer}
.sheet h3{font:800 28px var(--display); margin:0}
.sheet .st{font:800 18px var(--mono); margin:0 40px 0 0}
.sheet .mv{display:inline-block; margin-top:6px; font:700 14px var(--body); background:var(--soft); padding:3px 10px; border-radius:999px}
.sheet h4{font:700 13px var(--body); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 0 4px}
.sheet p{margin:0}
.qa{margin:4px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:4px}
.qa li::marker{color:var(--accent)}
.links{margin:4px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:2px}
.links a{display:inline-block; padding:6px 0; color:var(--accent); text-underline-offset:3px}
.close{position:absolute; top:10px; right:10px; border:0; background:var(--soft); color:var(--ink); width:36px; height:36px; border-radius:50%; font-size:20px; cursor:pointer}
.mini{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.mini button{border:1.5px solid var(--line); background:var(--bg); color:var(--ink); border-radius:999px; padding:4px 10px; font:700 13px var(--body); cursor:pointer}
footer{margin-top:40px; color:var(--muted); font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Responsters</h1>
      <p id="tagline"></p>
      <div class="dots" aria-hidden="true"><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i><i style="background:var(--c4)"></i><i style="background:var(--c5)"></i></div>
    </div>
    <div class="tools">
      <button class="linkbtn" id="howto-open" aria-controls="howto"></button>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-uk" data-lang="uk">UA</button><button id="lang-en" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-collection" data-view="collection"></button>
    <button role="tab" id="tab-practice" data-view="practice"></button>
    <button role="tab" id="tab-traps" data-view="traps"></button>
  </nav>

  <section class="howto" id="howto" aria-labelledby="howto-title" hidden>
    <h2 id="howto-title"></h2>
    <ol id="howto-steps"></ol>
    <p class="note" id="howto-note"></p>
    <button class="howto-done" id="howto-close"></button>
  </section>

  <section class="view" id="view-collection">
    <div class="progress"><span id="mastered"></span><div class="bar"><span id="masterbar"></span></div></div>
    <div class="chips" id="chips"></div>
    <div id="groups"></div>
  </section>

  <section class="view" id="view-practice" hidden>
    <div class="pbar">
      <div class="seg" role="group">
        <button id="mode-art" data-mode="art"></button>
        <button id="mode-code" data-mode="code"></button>
      </div>
      <div class="score" id="score"></div>
    </div>
    <div class="stage">
      <div class="prompt" id="prompt"></div>
      <div>
        <div class="opts" id="opts"></div>
        <div id="result"></div>
      </div>
    </div>
  </section>

  <section class="view" id="view-traps" hidden>
    <p id="traps-lede" style="margin:0 0 18px; color:var(--muted); max-width:65ch"></p>
    <div id="pairs"></div>
  </section>

  <footer id="foot"></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <button class="close" id="m-close" aria-label="Close">×</button>
    <div class="in">
      <p class="st" id="m-status"></p>
      <h3 id="m-name"></h3>
      <h4 id="m-h-move"></h4><p id="m-move"></p>
      <h4 id="m-h-mean"></h4><p id="m-mean"></p>
      <h4 id="m-h-when"></h4><p id="m-when"></p>
      <h4 id="m-h-qa"></h4><ul class="qa" id="m-qa"></ul>
      <h4 id="m-h-links"></h4><ul class="links" id="m-links"></ul>
      <div id="m-conf-wrap"><h4 id="m-h-conf"></h4><div class="mini" id="m-conf"></div></div>
    </div>
    <button class="back" id="m-back"></button>
  </div>
</div>

<script>
const CLS = {
  1:{c:'var(--c1)', uk:['Яйця','Ще вилуплюються: сервер отримав запит і працює.'], en:['Eggs','Still hatching: the server got the request and is working on it.']},
  2:{c:'var(--c2)', uk:['Друзі','Усе вдалося.'], en:['Friends','It worked.']},
  3:{c:'var(--c3)', uk:['Мандрівники','Те, що ти шукаєш, деінде.'], en:['Wanderers','What you want is somewhere else.']},
  4:{c:'var(--c4)', uk:['Вартові','Помилка з боку клієнта: виправ запит.'], en:['Gatekeepers','Client error: fix the request.']},
  5:{c:'var(--c5)', uk:['Серверні звірі','Помилка на сервері: ти не винна.'], en:['Server beasts','Server error: not your fault.']}
};
const D = [
 {c:102,s:'Processing',n:'Loadlet',m:'Spin Up',
  uk:['Сервер прийняв запит і ще обробляє його. Відповіді поки немає.','Довгі операції у WebDAV; у звичайних API зустрічається рідко.'],
  en:['The server accepted the request and is still working on it. No response yet.','Long WebDAV operations; rare in everyday APIs.']},
 {c:200,s:'OK',n:'Okayak',m:'Nod',
  uk:['Запит успішний, у відповіді є результат.','GET сторінки чи списку, успішний POST без створення ресурсу.'],
  en:['The request succeeded and the response carries the result.','GET of a page or list, a POST that did not create a resource.']},
 {c:201,s:'Created',n:'Buildbeaver',m:'Build',
  uk:['Створено новий ресурс. Його адреса в заголовку Location.','POST /orders створив замовлення.'],
  en:['A new resource was created. Its address is in the Location header.','POST /orders created an order.']},
 {c:204,s:'No Content',n:'Nullwing',m:'Munch',
  uk:['Успіх, але тіла відповіді немає.','DELETE або PUT, після яких нічого повертати.'],
  en:['Success, but there is no response body.','DELETE or PUT with nothing to return.']},
 {c:301,s:'Moved Permanently',n:'Relocrab',m:'New Shell',
  uk:['Ресурс назавжди переїхав. Клієнти й пошуковики мають оновити адресу.','Перехід зі старого домену чи з http на https.'],
  en:['The resource moved for good. Clients and search engines should update the URL.','Moving to a new domain, or http to https.']},
 {c:302,s:'Found',n:'Brbat',m:'Back Soon',
  uk:['Ресурс тимчасово за іншою адресою. Стара адреса лишається правильною.','Редірект після логіну, тимчасова сторінка акції.'],
  en:['The resource is temporarily elsewhere. The original URL stays correct.','Redirect after login, a temporary promo page.']},
 {c:304,s:'Not Modified',n:'Cachameleon',m:'Snapshot',
  uk:['Ресурс не змінився з часу кешування. Бери свою копію.','Браузер надіслав If-None-Match чи If-Modified-Since.'],
  en:['Nothing changed since you cached it. Use your copy.','The browser sent If-None-Match or If-Modified-Since.']},
 {c:400,s:'Bad Request',n:'Garblin',m:'Parse Fail',
  uk:['Запит некоректний: синтаксис, формат або невалідні дані.','Зламаний JSON, пропущене обов’язкове поле, некоректні query-параметри, обірване тіло запиту.'],
  en:['The request is malformed: syntax, format or invalid data.','Broken JSON, a missing required field, invalid query parameters, a request body cut off halfway.']},
 {c:401,s:'Unauthorized',n:'Whoowl',m:'Who Goes There',
  uk:['Потрібна автентифікація: облікових даних немає або вони невалідні.','Немає заголовка Authorization, прострочений токен.'],
  en:['Authentication is required: credentials are missing or invalid.','No Authorization header, an expired token.']},
 {c:403,s:'Forbidden',n:'Nopelican',m:'Hard No',
  uk:['Хто ти, відомо, але прав доступу немає.','Звичайний користувач відкриває адмінку.'],
  en:['Your identity is known, but you lack permission.','A regular user opens the admin panel.']},
 {c:404,s:'Not Found',n:'Nowherret',m:'Vanish',
  uk:['За цією адресою нічого немає.','Опечатка в URL, видалений товар.'],
  en:['Nothing exists at this address.','A typo in the URL, a deleted product.']},
 {c:405,s:'Method Not Allowed',n:'Verbadger',m:'Wrong Verb',
  uk:['Сервер знає цю адресу, але не приймає цей метод.','DELETE на ендпоінт, який приймає лише GET.'],
  en:['The server knows this address but doesn’t accept this method.','A DELETE sent to an endpoint that only accepts GET.']},
 {c:408,s:'Request Timeout',n:'Slowth',m:'Five More Minutes',
  uk:['Клієнт надсилав запит надто довго, і сервер перестав чекати.','Повільне з’єднання, завислий upload.'],
  en:['The client took too long to send the request, so the server stopped waiting.','A slow connection, a stalled upload.']},
 {c:409,s:'Conflict',n:'Clashgoat',m:'Horn Lock',
  uk:['Запит конфліктує з поточним станом ресурсу.','Зайнятий email при реєстрації, конфлікт версій при редагуванні.'],
  en:['The request conflicts with the current state of the resource.','An email that’s already taken at sign-up, a version conflict while editing.']},
 {c:413,s:'Content Too Large',n:'Megabite',m:'Overstuff',
  uk:['Тіло запиту більше за дозволений ліміт.','Завеликий файл при завантаженні.'],
  en:['The request body is larger than the allowed limit.','Uploading a file that’s too big.']},
 {c:415,s:'Unsupported Media Type',n:'Pickoala',m:'Picky Eater',
  uk:['Сервер не підтримує цей формат даних.','XML замість JSON, неправильний Content-Type.'],
  en:['The server doesn’t support this data format.','XML instead of JSON, a wrong Content-Type.']},
 {c:418,s:"I'm a teapot",n:'Teapotamus',m:'Steep',
  uk:['Жартівливий код з RFC 2324: чайник відмовляється варити каву.','Великодні яйця в API. На співбесіді — гарний бонус.'],
  en:['A joke code from RFC 2324: a teapot refuses to brew coffee.','Easter eggs in APIs. A nice bonus in an interview.']},
 {c:422,s:'Unprocessable Content',n:'Nitpecker',m:'Validation Peck',

const QA = {"102": {"uk": ["Запусти довгу операцію (наприклад, імпорт великого файлу чи копіювання великої папки) і чекай, нічого не чіпаючи → сторінка дочікується результату, без помилки таймауту.", "Поки триває довга операція, стеж за її статусом в інтерфейсі → видно прогрес, а «Готово» з’являється лише після справжнього завершення."], "en": ["Start a long operation (e.g., import a big file or copy a large folder) and wait without touching the page → the page keeps waiting and shows the result, no timeout error.", "While the long operation runs, watch its status in the UI → it shows progress, and \"Done\" appears only when the operation has really finished."]}, "200": {"uk": ["Збережи запис із відомими значеннями, потім відкрий його (або список, де він є) → кожне поле показує саме те, що було збережено, нічого не бракує й нічого зайвого.", "Відкрий список, у якому ще нічого немає (наприклад, замовлення нового акаунта) → дружнє «Тут поки порожньо» і статус 200, а не сторінка помилки.", "Надішли форму з невалідними даними й перевір вкладку Network → статус 4xx, а не 200 з повідомленням про помилку всередині."], "en": ["Save a record with known values, then open it (or the list it's in) → every field shows exactly what was saved, nothing missing or extra.", "Open a list that has no items yet (e.g., orders of a new account) → a friendly \"Nothing here yet\" and status 200, not an error page.", "Submit a form with invalid data and check the Network tab → the status is 4xx, not 200 with an error message hidden inside."]}, "201": {"uk": ["Створи новий об’єкт (наприклад, коментар чи замовлення) і відкрий список → новий об’єкт є там саме з тими значеннями, які було введено.", "Заповни форму створення й швидко двічі клацни «Надіслати» → створюється лише один об’єкт.", "Створи об’єкт, скопіюй його посилання й відкрий у новій вкладці → об’єкт відкривається."], "en": ["Create a new item (e.g., a comment or an order) and open the list → the new item is there with exactly the values you entered.", "Fill in a create form and quickly double-click Submit → only one item is created.", "Create an item, copy its link and open it in a new tab → the item opens."]}, "204": {"uk": ["Видали об’єкт зі списку → він одразу зникає без повідомлення про помилку й не з’являється знову після оновлення сторінки.", "Скопіюй посилання на об’єкт, видали його, потім відкрий скопійоване посилання → сторінка «не знайдено» (404), а не старий об’єкт.", "Відкрий запис у двох вкладках браузера. Видали його в першій, потім спробуй видалити в другій → система обробляє це коректно (наприклад, «Запис не знайдено»), без серверної помилки."], "en": ["Delete an item from a list → it disappears right away with no error message, and it stays gone after a page refresh.", "Copy the link to an item, delete the item, then open the copied link → a \"not found\" page (404), not the old item.", "Open a record in two browser tabs. Delete it in the first tab, then try deleting it in the second tab → the system handles it gracefully (e.g., \"Item not found\") without a server error."]}, "301": {"uk": ["Відкрий старий URL, який переїхав (наприклад, старе посилання на товар) → потрапляєш на нову сторінку, а у вкладці Network один перехід 301, без ланцюжка.", "Відкрий старий URL з параметрами (наприклад, ?page=2&sort=price) → нова сторінка відкривається з тими самими параметрами.", "Відкрий http://-версію будь-якої сторінки → тебе переводить на https:// зі статусом 301, а не 302 чи копія сторінки з 200."], "en": ["Open an old URL that has moved (e.g., an old product link) → you land on the new page, and the Network tab shows one 301 hop, not a chain.", "Open the old URL with parameters added (e.g., ?page=2&sort=price) → the new page opens with the same parameters.", "Open the http:// version of any page → you're moved to https:// with status 301, not 302 or a 200 copy of the page."]}, "302": {"uk": ["Вийди з акаунта, відкрий сторінку, що потребує входу, за прямим посиланням, потім увійди → потрапляєш туди, куди вказують вимоги (назад на цю сторінку чи, наприклад, у кабінет), а не на сторінку помилки чи порожню сторінку.", "Знайди параметр редіректу в URL логіну (наприклад, ?next=/orders), заміни його на зовнішній сайт (?next=https://example.com) і увійди → лишаєшся на нашому сайті.", "Надішли форму (наприклад, оформлення замовлення), потім натисни F5 на сторінці підтвердження → немає попередження «надіслати форму повторно» і немає другого замовлення."], "en": ["Log out, open a page that needs login by its direct link, then log in → you land where the requirements say (back on that page or, e.g., the account dashboard), not on an error or blank page.", "Find the redirect parameter in the login URL (e.g., ?next=/orders), replace it with an external site (?next=https://example.com) and log in → you stay on our site.", "Submit a form (e.g., checkout), then press F5 on the confirmation page → no \"resend form\" warning and no second order."]}, "304": {"uk": ["Відкрий сторінку, потім перезавантаж її з відкритою вкладкою Network → незмінні картинки, скрипти й стилі приходять як 304.", "Зміни щось помітне (наприклад, назву товару в адмінці), потім звичайно перезавантаж сторінку → видно нове значення, а не старе з кешу.", "Після деплою відкрий сайт у браузері, де вже був на ньому, без чищення кешу → сайт працює без помилок (жодної суміші старих і нових файлів), а нова версія з’являється одразу чи в межах заявленого часу кешування."], "en": ["Open a page, then reload it with the Network tab open → images, scripts and styles that didn't change come back as 304.", "Change something visible (e.g., a product title in the admin), then reload the page normally → the new value shows, not the cached old one.", "After a deploy, open the site in a browser that visited it before, without clearing the cache → the site works with no errors (no mix of old and new files), and the new version shows right away or within the stated cache time."]}, "400": {"uk": ["У Postman (або DevTools) надішли запит зі зламаним JSON або без обов’язкового поля → статус 400, а не 500.", "Надішли той самий зламаний запит і прочитай повідомлення → воно називає, що саме не так (яке поле, який формат).", "Подивись повну відповідь з помилкою → у ній немає стектрейсу, шляхів до файлів чи SQL."], "en": ["In Postman (or DevTools), send a request with broken JSON or without a required field → status 400, not 500.", "Send the same broken request and read the error message → it names what exactly is wrong (which field, what format).", "Look at the full error response → no stack trace, file paths or SQL inside."]}, "401": {"uk": ["Вийди з акаунта й відкрий закриту сторінку (або її API) за прямим посиланням → отримуєш сторінку входу або статус 401, а не вміст.", "Увійди, дочекайся, поки сесія закінчиться (або видали cookie сесії), потім клацни щось → тебе просять увійти знову, і після входу можна продовжити.", "Вийди з акаунта, натисни «Назад» у браузері й спробуй дію на старій сторінці → доступу немає, тебе просять увійти."], "en": ["Log out and open a private page (or call its API) by direct link → you get the login page or status 401, not the content.", "Log in, wait until the session expires (or delete the session cookie), then click something → you're asked to log in again, and after login you can continue.", "Log out, press Back in the browser and try an action on the old page → no access, you're asked to log in."]}, "403": {"uk": ["Увійди звичайним користувачем і відкрий адмінський URL за прямим посиланням (наприклад, /admin) → адмін-сторінка не відкривається (нема доступу, сторінка входу чи 404, як у вимогах).", "Увійди як користувач A, відкрий своє замовлення й зміни id в URL на замовлення користувача B → замовлення B не видно.", "Як адмін, скопіюй з DevTools запит дії лише для адміна; як звичайний користувач, надішли той самий запит → статус 403, нічого не змінюється."], "en": ["Log in as a regular user and open an admin URL by direct link (e.g., /admin) → the admin page doesn't open (no access, a login page or a 404, as the requirements say).", "Log in as user A, open one of your orders and change the id in the URL to user B's order → B's order is not shown.", "As an admin, copy the request of an admin-only action from DevTools; as a regular user, send the same request → status 403, nothing changes."]}, "404": {"uk": ["Відкрий URL з опечаткою (наприклад, /prodcts) → дружня сторінка 404 зі шляхом назад (меню, пошук чи посилання на головну).", "Відкрий об’єкт і зміни id в URL на неіснуючий (наприклад, 999999) → сторінка 404, а не серверна помилка.", "Відкрий неіснуючу сторінку з відкритою вкладкою Network → статус справді 404, а не 200 («soft 404»)."], "en": ["Open a URL with a typo (e.g., /prodcts) → a friendly 404 page with a way back (menu, search or a home link).", "Open an item and change its id in the URL to one that doesn't exist (e.g., 999999) → a 404 page, not a server error.", "Open a missing page with the Network tab open → the status is really 404, not 200 (a \"soft 404\")."]}, "408": {"uk": ["У DevTools постав мережу Slow 3G і надішли велику форму чи завантаж великий файл → через деякий час з’являється зрозуміле повідомлення про таймаут, а не нескінченний спінер.", "Після повідомлення про таймаут поверни нормальну мережу й повтори → усе працює, а введені дані лишилися у формі."], "en": ["In DevTools, set the network to Slow 3G and submit a big form or upload a large file → after a while a clear timeout message appears, not an endless spinner.", "After the timeout message, switch the network back to normal and retry → it works, and the data you typed is still in the form."]}, "418": {"uk": ["Якщо в продукті є великоднє яйце (наприклад, /teapot), виклич його, потім кілька справжніх ендпоінтів → справжні працюють як завжди.", "Перевір моніторинг і алерти після виклику великоднього яйця → немає тривоги про невідому помилку."], "en": ["If the product has an easter egg (e.g., /teapot), call it, then call a few real endpoints → the real ones still work normally.", "Check monitoring and alerts after calling the easter egg → no alarm about an unknown error."]}, "429": {"uk": ["Дізнайся заявлений ліміт (документація, заголовок відповіді або уточни в розробника), наприклад, 5 спроб входу за хвилину; зроби рівно стільки спроб, а потім ще одну → блокується лише зайва.", "Після закінчення часу блокування спробуй ще → знову працює.", "Досягни ліміту як користувач A, потім одразу спробуй як користувач B в іншому браузері → користувача B не має бути заблоковано."], "en": ["Find the stated limit (docs, response header, or ask a developer), e.g., 5 login attempts per minute; make exactly that many attempts, then one more → only the extra one is blocked.", "Once the block time is over, try again → it works again.", "Reach the limit as user A, then right away try as user B in another browser → user B should not be blocked."]}, "500": {"uk": ["Встав у текстові поля неочікувані дані (емодзі, 10 000 символів, <script>, ' OR 1=1) і надішли → без серверної помилки: або звичайний результат, або повідомлення валідації.", "Якщо 500 таки виникла, подивись на сторінку → повідомлення для користувача без технічної інформації (наприклад, «Щось пішло не так, спробуйте ще»).", "Після 500 перевір логи чи моніторинг → помилка там є з часом, URL і деталями запиту."], "en": ["Paste unexpected input into text fields (emoji, 10,000 characters, <script>, ' OR 1=1) and submit → no server error: either a normal result or a validation message.", "If a 500 does happen, look at the page → a message for the user with no technical information (e.g., \"Something went wrong, please try again\").", "After a 500, check the logs or monitoring → the error is there with the time, URL and request details."]}, "502": {"uk": ["На тестовому середовищі зупини бекенд-сервіс і відкрий сайт → дружня сторінка помилки, а не сира сторінка nginx чи проксі.", "Прочитай цю сторінку помилки і відповідь → немає внутрішніх IP-адрес, імен хостів чи версій серверів.", "Знову запусти бекенд і перезавантаж сайт → усе працює без додаткових дій."], "en": ["On a test environment, stop the backend service and open the site → a friendly error page, not a raw nginx or proxy page.", "Read that error page and its response → no internal IP addresses, host names or server versions.", "Start the backend again and reload the site → it works without any additional steps."]}, "503": {"uk": ["Увімкни режим запланованих техробіт (або відкрий сайт під час деплою) → сторінка техробіт з орієнтовним часом повернення, а не зламана верстка.", "Відкрий сторінку техробіт з відкритою вкладкою Network → статус 503, а не 200.", "Під час навантажувального тесту стеж за відповідями, поки росте навантаження → при перевантаженні частина запитів отримує 503, але сайт не падає повністю й оживає, коли навантаження спадає."], "en": ["Turn on planned maintenance mode (or open the site during a deploy) → a maintenance page with an expected return time, not a broken layout.", "Open the maintenance page with the Network tab open → status 503, not 200.", "During a load test, watch the responses as load grows → when overloaded, some requests get 503, but the site doesn't go down completely and recovers when load drops."]}, "405": {"uk": ["У Postman надішли DELETE (або PUT) на ендпоінт, що лише читає дані (наприклад, публічний список) → статус 405, нічого не видалено.", "Подивись заголовки цієї відповіді 405 → є заголовок Allow зі списком дозволених методів.", "Спробуй кожен непідтримуваний метод на цьому ендпоінті → завжди 405, ніколи 404 чи 500."], "en": ["In Postman, send DELETE (or PUT) to an endpoint that only reads data (e.g., a public list) → status 405, nothing is deleted.", "Look at the headers of that 405 response → there is an Allow header listing the methods you can use.", "Try each unsupported method on the endpoint → always 405, never 404 or 500."]}, "409": {"uk": ["Зареєструйся з email, на який уже є акаунт → новий акаунт не створюється, а повідомлення таке, як у вимогах (пряме «Цей email уже використовується» чи нейтральне «Перевір пошту»).", "Відкрий той самий запис у двох вкладках. Зміни й збережи в першій, потім зміни й збережи в другій → друге збереження попереджає про конфлікт, а не мовчки перезаписує першу зміну.", "Прочитай повідомлення про конфлікт → воно каже, з чим саме конфлікт (яке поле чи яка версія)."], "en": ["Sign up with an email that already has an account → no new account is created, and the message is what the requirements say (a direct \"This email is already in use\" or a neutral \"Check your inbox\").", "Open the same record in two tabs. Change and save it in the first tab, then change and save it in the second → the second save warns about the conflict instead of silently overwriting the first change.", "Read the conflict message → it says what exactly conflicts (which field or which version)."]}, "413": {"uk": ["Дізнайся ліміт завантаження (наприклад, 10 МБ) і завантаж файли трохи менші, рівно на межі й трохи більші → поведінка на межі відповідає вимогам (≤ чи <), а все, що більше, відхиляється.", "Порівняй ліміт у підказці біля поля завантаження з розміром, який реально відхиляється → вони збігаються.", "Завантаж явно завеликий файл → зрозуміле повідомлення з дозволеним розміром, а не обірване з’єднання чи нескінченне завантаження."], "en": ["Find the upload limit (e.g., 10 MB) and upload files just under, exactly at and just over it → behaviour at the limit matches the requirements (≤ or <), and anything bigger is rejected.", "Compare the limit in the hint next to the upload field with the size that actually gets rejected → they match.", "Upload a file that's clearly too big → a clear message with the allowed size, not a dropped connection or an endless upload."]}, "415": {"uk": ["У Postman надішли валідне JSON-тіло з Content-Type: text/plain (або без Content-Type) → статус 415, а не 500.", "Надішли ті самі дані як XML чи form-data на ендпоінт, що приймає лише JSON → статус 415 з повідомленням, який формат очікується."], "en": ["In Postman, send a valid JSON body with Content-Type: text/plain (or with no Content-Type) → status 415, not 500.", "Send the same data as XML or form-data to an endpoint that only takes JSON → status 415 with a message saying which format is expected."]}, "422": {"uk": ["Введи -5 у поле віку (або невалідний email: «banana», «anna@», «@mail.com», «anna@@mail.com», «anna k@mail.com») і надішли → повідомлення про помилку прямо під цим полем, форма не надсилається.", "Заповни кілька полів невалідними значеннями, а решту валідними, і надішли → усі помилки видно одразу, а валідні значення лишаються у формі.", "Спробуй граничні значення по черзі: порожнє обов’язкове поле, максимальна довжина + 1 символ, дата народження в майбутньому, 29 лютого в невисокосному році → кожне відхиляється із зрозумілою причиною."], "en": ["Enter -5 in the age field (or an invalid email: \"banana\", \"anna@\", \"@mail.com\", \"anna@@mail.com\", \"anna k@mail.com\") and submit → an error message right under that field, and the form isn't sent.", "Fill several fields with invalid values and the rest with valid ones, then submit → all errors are shown at once, and the valid values stay filled in.", "Try boundary values one by one: an empty required field, max length + 1 character, a birth date in the future, 29 February in a non-leap year → each is rejected with a clear reason."]}, "504": {"uk": ["Запусти найповільнішу операцію, яку знайдеш (наприклад, річний звіт чи повний експорт) → після таймауту з’являється зрозуміле повідомлення, а не нескінченний спінер.", "Запусти дуже довгу операцію й піди зі сторінки → вона продовжується у фоні, і ти отримуєш сповіщення (або готовий файл), коли все готово.", "Після повідомлення про таймаут натисни «Повторити» → операція запускається знову, і фільтри чи дані не треба вводити заново."], "en": ["Start the slowest operation you can find (e.g., a yearly report or a full export) → after the timeout a clear message appears, not an endless spinner.", "Start a very long operation and leave the page → it continues in the background, and you get a notification (or a ready file) when it's done.", "After the timeout message, press Retry → the operation starts again without re-entering filters or data."]}};

function pick(){
  const pool = D.filter(d=>d.c!==last);
  const ws = pool.map(d=>weight[d.c]||1), sum = ws.reduce((a,b)=>a+b,0);
  let r = Math.random()*sum;
  for(let i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
function distractors(d){
  const conf = (CONF[d.c]||[]).map(c=>BY[c]);
  const same = D.filter(x=>cls(x.c)===cls(d.c) && x.c!==d.c && !conf.includes(x));
  const other = D.filter(x=>cls(x.c)!==cls(d.c) && !conf.includes(x));
  const sh = a => a.sort(()=>Math.random()-.5);
  return sh([...sh(conf), ...sh(same), ...sh(other)].slice(0,3).concat(d));
}

  box.appendChild(why);
}
function render(){ renderChrome(); if(view==='collection') renderCollection(); if(view==='practice') renderPractice(); if(view==='traps') renderTraps(); }

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b){ if(e.target.id==='modal') closeModal(); return; }
  if(b.dataset.lang){ lang=b.dataset.lang; store.set('lang',lang); render(); }
  else if(b.dataset.view){ view=b.dataset.view; render(); }
  else if(b.dataset.f!=null){ filter=+b.dataset.f; renderCollection(); }
  else if(b.dataset.mode){ mode=b.dataset.mode; renderChrome(); newRound(); }
  else if(b.dataset.ans){ answer(+b.dataset.ans); }
  else if(b.id==='next'){ newRound(); }
  else if(b.dataset.sc){ scAnswer(b.dataset.sc, +b.dataset.v); }
  else if(b.dataset.open){ openCard(+b.dataset.open); }
  else if(b.id==='m-close' || b.id==='m-back'){ closeModal(); }
  else if(b.id==='howto-open'){ howtoOpen=!howtoOpen; renderChrome(); if(howtoOpen) $('howto-close').focus(); }
  else if(b.id==='howto-close'){ howtoOpen=false; store.set('howtoSeen',true); renderChrome(); $('howto-open').focus(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('modal').hidden) closeModal(); });
const h = location.hash.slice(1); if(['collection','practice','traps'].includes(h)) view = h;
render();
</script>

</body>
</html>
