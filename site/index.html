<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Responsters: original creatures for memorizing HTTP status codes, with a practice deck and drills for codes that are easy to confuse.">
<title>Responsters</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@600;800&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/collection.css">
<link rel="stylesheet" href="css/practice.css">
<link rel="stylesheet" href="css/traps.css">
<link rel="stylesheet" href="css/detail.css">

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Responsters</h1>
      <p id="tagline"></p>
      <div class="dots" aria-hidden="true"><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i><i style="background:var(--c4)"></i><i style="background:var(--c5)"></i></div>
    </div>
    <div class="tools">
      <button class="linkbtn" id="howto-open" aria-controls="howto"></button>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-uk" data-lang="uk">UA</button><button id="lang-en" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-collection" data-view="collection"></button>
    <button role="tab" id="tab-practice" data-view="practice"></button>
    <button role="tab" id="tab-traps" data-view="traps"></button>
  </nav>

  <section class="howto" id="howto" aria-labelledby="howto-title" hidden>
    <h2 id="howto-title"></h2>
    <ol id="howto-steps"></ol>
    <p class="note" id="howto-note"></p>
    <button class="howto-done" id="howto-close"></button>
  </section>

  <section class="view" id="view-collection">
    <div class="progress"><span id="mastered"></span><div class="bar"><span id="masterbar"></span></div></div>
    <div class="chips" id="chips"></div>
    <div id="groups"></div>
  </section>

  <section class="view" id="view-practice" hidden>
    <div class="pbar">
      <div class="seg" role="group">
        <button id="mode-art" data-mode="art"></button>
        <button id="mode-code" data-mode="code"></button>
      </div>
      <div class="score" id="score"></div>
    </div>
    <div class="stage" id="stage">
      <div class="prompt" id="prompt"></div>
      <div class="opts" id="opts"></div>
      <div id="result"></div>
    </div>
  </section>

  <section class="view" id="view-traps" hidden>
    <p id="traps-lede" style="margin:0 0 18px; color:var(--muted); max-width:65ch"></p>
    <div id="pairs"></div>
  </section>

  <footer id="foot"></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <button class="close" id="m-close" aria-label="Close">×</button>
    <div class="in">
      <p class="st" id="m-status"></p>
      <h3 id="m-name"></h3>
      <h4 id="m-h-move"></h4><p id="m-move"></p>
      <h4 id="m-h-mean"></h4><p id="m-mean"></p>
      <h4 id="m-h-when"></h4><p id="m-when"></p>
      <h4 id="m-h-qa"></h4><ul class="qa" id="m-qa"></ul>
      <h4 id="m-h-links"></h4><ul class="links" id="m-links"></ul>
      <div id="m-conf-wrap"><h4 id="m-h-conf"></h4><div class="mini" id="m-conf"></div></div>
    </div>
    <button class="back" id="m-back"></button>
  </div>
</div>

<script type="module">
import { CLS } from './data/classes.js';
import { D, BY } from './data/cards.js';
import { QA } from './data/qa.js';
import { PAIRS } from './data/traps.js';
import { TOOLS, REF, MORE } from './data/links.js';
function cardLinks(c){
  const r = REF[c], d = BY[c], out = [];
  if(r) out.push({uk:`RFC ${r[0]} §${r[1]}`, en:`RFC ${r[0]} §${r[1]}`, u:`https://www.rfc-editor.org/rfc/rfc${r[0]}#section-${r[1]}`});
  out.push({uk:`MDN: ${c} ${d.s}`, en:`MDN: ${c} ${d.s}`, u:`https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/${c}`});
  return out.concat(MORE[c]||[], TOOLS);
}
const CONF = {};
PAIRS.forEach(p=>p.codes.forEach(c=>{CONF[c]=(CONF[c]||[]).concat(p.codes.filter(x=>x!==c))}));
const T = {
 uk:{tag:'Оригінальні істоти для запам’ятовування HTTP-статусів. У кожного коду свій Responster, а кожен рух пояснює, що код означає.',
   tabs:['Колекція','Тренування','Пастки'], all:'Усі', mastered:(a,b)=>`Засвоєно ${a} з ${b}`, known:'знаю',
   modeArt:'Картинка → код', modeCode:'Код → істота', qArt:'Який це код?', qCode:'Хто з них?',
   score:(r,t,s)=>`${r}/${t} · серія ${s}`, ok:'Так!', no:'Не цей.', next:'Далі',
   move:'Рух', mean:'Що означає', when:'Коли зустрічається', conf:'Часто плутають з', qa:'Що тестуємо', links:'Інструменти й довідка',
   traps:'Пари кодів, які найчастіше плутають. Прочитай правило, потім розклади ситуації.',
   foot:'Responsters · персонажі й тексти власні; назви статусів за RFC 9110.', close:'Закрити', back:'До колекції',
   howto:'Як користуватися',
   howtoSteps:['<b>Колекція.</b> Натисни на картку, щоб познайомитися з істотою: що означає код, де зустрічається і що тестувати.',
     '<b>Тренування.</b> «Картинка → код» або «Код → істота». Після двох правильних відповідей поспіль код отримує ✓.',
     '<b>Пастки.</b> Пари кодів, які часто плутають: правило і ситуації, щоб їх розкласти.'],
   howtoNote:'Прогрес зберігається лише в цьому браузері.', howtoClose:'Зрозуміло'},
 en:{tag:'Original creatures for memorizing HTTP status codes. Every code has its own Responster, and every move explains what the code means.',
   tabs:['Collection','Practice','Traps'], all:'All', mastered:(a,b)=>`${a} of ${b} learned`, known:'known',
   modeArt:'Picture → code', modeCode:'Code → creature', qArt:'Which code is this?', qCode:'Which one is it?',
   score:(r,t,s)=>`${r}/${t} · streak ${s}`, ok:'Yes!', no:'Not this one.', next:'Next',
   move:'Move', mean:'What it means', when:'Where you meet it', conf:'Often confused with', qa:'What to test', links:'Tools and Read more',
   traps:'Pairs of codes people mix up most. Read the rule, then sort the situations.',
   foot:'Responsters · original characters and copy; status names per RFC 9110.', close:'Close', back:'Back to collection',
   howto:'How to use',
   howtoSteps:['<b>Collection.</b> Tap a card to meet the creature: what the code means, where you meet it and what to test.',
     '<b>Practice.</b> “Picture → code” or “Code → creature”. Two correct answers in a row give a code its ✓.',
     '<b>Traps.</b> Pairs of codes people mix up: a rule and situations to sort.'],
   howtoNote:'Progress is saved in this browser only.', howtoClose:'Got it'}
};
const cls = c => Math.floor(c/100);
const img = c => `img/${c}.jpg`, art = c => `img/${c}-art.jpg`;
const store = {get(k,d){try{const v=localStorage.getItem('httpon.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem('httpon.'+k,JSON.stringify(v))}catch(e){}}};
let lang = store.get('lang','uk'), view = 'collection', filter = 0, mode = 'art';
let weight = store.get('weight',{}), streakBy = store.get('streak',{});
let stats = {r:0,t:0,s:0}, cur = null, last = null;
let howtoOpen = !store.get('howtoSeen', false);   // shown on the first visit until dismissed
const t = () => T[lang];
const $ = id => document.getElementById(id);
const isKnown = c => (streakBy[c]||0) >= 2;

function renderChrome(){
  document.documentElement.lang = lang;
  $('tagline').textContent = t().tag;
  ['uk','en'].forEach(l=>$('lang-'+l).setAttribute('aria-pressed', l===lang));
  ['collection','practice','traps'].forEach((v,i)=>{const b=$('tab-'+v); b.textContent=t().tabs[i]; b.setAttribute('aria-selected', v===view)});
  ['collection','practice','traps'].forEach(v=>$('view-'+v).hidden = v!==view);
  $('mode-art').textContent=t().modeArt; $('mode-code').textContent=t().modeCode;
  $('mode-art').setAttribute('aria-pressed',mode==='art'); $('mode-code').setAttribute('aria-pressed',mode==='code');
  $('howto-open').textContent=t().howto; $('howto-open').setAttribute('aria-expanded', howtoOpen);
  $('howto').hidden=!howtoOpen; $('howto-title').textContent=t().howto;
  $('howto-steps').innerHTML=t().howtoSteps.map(s=>`<li>${s}</li>`).join('');
  $('howto-note').textContent=t().howtoNote; $('howto-close').textContent=t().howtoClose;
  $('traps-lede').textContent=t().traps; $('foot').textContent=t().foot; $('m-close').setAttribute('aria-label',t().close);
}
function renderCollection(){
  const k = D.filter(d=>isKnown(d.c)).length;
  $('mastered').textContent = t().mastered(k, D.length);
  $('masterbar').style.width = (k/D.length*100)+'%';
  const chips = [[0,t().all,null]].concat([1,2,3,4,5].map(n=>[n,`${n}xx ${CLS[n][lang][0]}`,CLS[n].c]));
  $('chips').innerHTML = chips.map(([n,l,c])=>`<button class="chip" data-f="${n}" aria-pressed="${filter===n}">${c?`<i style="background:${c}"></i>`:''}${l}</button>`).join('');
  $('groups').innerHTML = [1,2,3,4,5].filter(n=>!filter||filter===n).map(n=>`
    <div class="group"><h2><code style="background:${CLS[n].c}">${n}xx</code>${CLS[n][lang][0]}</h2>
    <p class="lede">${CLS[n][lang][1]}</p>
    <div class="grid">${D.filter(d=>cls(d.c)===n).map(d=>`<button class="card" data-open="${d.c}" aria-label="${d.c} ${d.s}: ${d.n}${isKnown(d.c)?`, ${t().known}`:''}"><img src="${img(d.c)}" alt="" loading="lazy">${isKnown(d.c)?`<span class="badge" aria-hidden="true">✓</span>`:''}</button>`).join('')}</div></div>`).join('');
}
function openCard(c){
  const d = BY[c], L = d[lang];
  document.querySelector('.sheet').style.setProperty('--cls', CLS[cls(c)].c);
  $('m-back').textContent = '← ' + t().back;
  $('m-status').textContent = `${c} ${d.s}`; $('m-status').style.color = 'var(--ink)';
  $('m-name').textContent = d.n;
  $('m-h-move').textContent = t().move; $('m-move').textContent = d.m;
  $('m-h-mean').textContent = t().mean; $('m-mean').textContent = L[0];
  $('m-h-when').textContent = t().when; $('m-when').textContent = L[1];
  $('m-h-qa').textContent = t().qa; $('m-qa').innerHTML = (QA[c]?QA[c][lang]:[]).map(x=>`<li>${x.replace(/</g,'&lt;')}</li>`).join('');
  $('m-h-links').textContent = t().links;
  $('m-links').innerHTML = cardLinks(c).map(x=>`<li><a href="${x.u}" target="_blank" rel="noopener">${x[lang]} ↗</a></li>`).join('');
  const cf = CONF[c]||[]; $('m-conf-wrap').hidden = !cf.length; $('m-h-conf').textContent = t().conf;
  $('m-conf').innerHTML = cf.map(x=>`<button data-open="${x}">${x} ${BY[x].n}</button>`).join('');
  $('modal').hidden = false; $('m-close').focus();
}
function closeModal(){ $('modal').hidden = true; }

function pick(){
  const pool = D.filter(d=>d.c!==last);
  const ws = pool.map(d=>weight[d.c]||1), sum = ws.reduce((a,b)=>a+b,0);
  let r = Math.random()*sum;
  for(let i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
function distractors(d){
  const conf = (CONF[d.c]||[]).map(c=>BY[c]);
  const same = D.filter(x=>cls(x.c)===cls(d.c) && x.c!==d.c && !conf.includes(x));
  const other = D.filter(x=>cls(x.c)!==cls(d.c) && !conf.includes(x));
  const sh = a => a.sort(()=>Math.random()-.5);
  return sh([...sh(conf), ...sh(same), ...sh(other)].slice(0,3).concat(d));
}
function newRound(){ cur = pick(); last = cur.c; cur.opts = distractors(cur); cur.done = false; renderPractice(); }
function renderPractice(){
  if(!cur) return newRound();
  $('score').textContent = t().score(stats.r, stats.t, stats.s);
  const d = cur;
  $('stage').dataset.mode = mode;
  $('prompt').innerHTML = mode==='art'
    ? `<div class="q">${t().qArt}</div><img class="art" src="${art(d.c)}" alt="">`
    : `<div class="q">${t().qCode}</div><div class="bigcode">${d.c}</div><div class="bigstatus">${d.s}</div>`;
  $('opts').innerHTML = d.opts.map(o=>{
    const st = d.done ? (o.c===d.c?'right':(o.c===d.pick?'wrong':'')) : '';
    return mode==='art'
      ? `<button class="opt ${st}" data-ans="${o.c}" ${d.done?'disabled':''}><b>${o.c}</b><span>${o.s}</span></button>`
      : `<button class="opt imgopt ${st}" data-ans="${o.c}" ${d.done?'disabled':''} aria-label="${o.n}"><img src="${art(o.c)}" alt=""><span class="nm">${o.n}</span></button>`;
  }).join('');
  $('result').innerHTML = d.done ? `<div class="reveal"><div class="rimg"><img src="${img(d.c)}" alt="${d.c} ${d.n}"></div><div class="txt">
     <p class="verdict ${d.pick===d.c?'ok':'no'}">${d.pick===d.c?t().ok:t().no}</p>
     <p><b>${d.c} ${d.s}</b> · ${d.n}</p><p>${d[lang][0]}</p>
     <button class="next" id="next">${t().next} →</button></div></div>` : '';
}
function answer(c){
  if(cur.done) return;
  cur.done = true; cur.pick = c; stats.t++;
  if(c===cur.c){ stats.r++; stats.s++; weight[cur.c]=Math.max(1,(weight[cur.c]||1)-1); streakBy[cur.c]=(streakBy[cur.c]||0)+1; }
  else { stats.s=0; weight[cur.c]=(weight[cur.c]||1)+2; streakBy[cur.c]=0; }
  store.set('weight',weight); store.set('streak',streakBy);
  renderPractice(); const n=$('next'); if(n) n.focus();
}
function renderTraps(){
  $('pairs').innerHTML = PAIRS.map((p,pi)=>`<div class="pair"><h3>${p[lang][0]}</h3><p class="rule">${p[lang][1]}</p>
    <div class="duo">${p.codes.map(c=>`<button data-open="${c}" aria-label="${c} ${BY[c].n}"><img src="${img(c)}" alt="" loading="lazy"></button>`).join('')}</div>
    <div class="scen">${p.s.map((s,si)=>`<div class="sc" id="sc-${pi}-${si}"><p>${lang==='uk'?s[1]:s[2]}</p><div class="btns">${p.codes.map(c=>`<button data-sc="${pi}-${si}" data-v="${c}">${c}</button>`).join('')}</div></div>`).join('')}</div></div>`).join('');
}
function scAnswer(key, v){
  const [pi,si] = key.split('-').map(Number), s = PAIRS[pi].s[si], box = $('sc-'+key);
  box.querySelectorAll('button').forEach(b=>{ const c=+b.dataset.v; b.disabled=true; if(c===s[0]) b.classList.add('right'); else if(c===v) b.classList.add('wrong'); });
  const why = document.createElement('div'); why.className='why';
  why.textContent = `${v===s[0]?'✓':'✗'} ${s[0]} ${BY[s[0]].n}: ${BY[s[0]][lang][0]}`;
  box.appendChild(why);
}
function render(){ renderChrome(); if(view==='collection') renderCollection(); if(view==='practice') renderPractice(); if(view==='traps') renderTraps(); }

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b){ if(e.target.id==='modal') closeModal(); return; }
  if(b.dataset.lang){ lang=b.dataset.lang; store.set('lang',lang); render(); }
  else if(b.dataset.view){ view=b.dataset.view; render(); }
  else if(b.dataset.f!=null){ filter=+b.dataset.f; renderCollection(); }
  else if(b.dataset.mode){ mode=b.dataset.mode; renderChrome(); newRound(); }
  else if(b.dataset.ans){ answer(+b.dataset.ans); }
  else if(b.id==='next'){ newRound(); }
  else if(b.dataset.sc){ scAnswer(b.dataset.sc, +b.dataset.v); }
  else if(b.dataset.open){ openCard(+b.dataset.open); }
  else if(b.id==='m-close' || b.id==='m-back'){ closeModal(); }
  else if(b.id==='howto-open'){ howtoOpen=!howtoOpen; renderChrome(); if(howtoOpen) $('howto-close').focus(); }
  else if(b.id==='howto-close'){ howtoOpen=false; store.set('howtoSeen',true); renderChrome(); $('howto-open').focus(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('modal').hidden) closeModal(); });
const h = location.hash.slice(1); if(['collection','practice','traps'].includes(h)) view = h;
render();
</script>

</body>
</html>
