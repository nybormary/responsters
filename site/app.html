<!doctype html>
<!-- App template (RSP-138): not served as is. scripts/build-pages.mjs writes it as /<lang>/http/ per language,
     with lang, title, description, canonical and hreflang filled in. Paths are absolute for that reason. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- build: analytics -->
    <meta name="description" content="Original creatures for memorizing HTTP status codes." />
    <title>Responsters</title>
    <!-- build: canonical and hreflang -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- fonts (RSP-160): served from the site (@font-face in css/fonts.css); the build copies this block into every page.
         Preload only the two Latin files the first screen needs: body text and the site name. -->
    <link
      rel="preload"
      href="/fonts/atkinson-hyperlegible-next-5.3.0/atkinson-hyperlegible-next-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/bitter-5.3.0/bitter-latin-800-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- /fonts -->
    <!-- styles (RSP-160): the build joins these files, in this order, into one /css/page-app.css. -->
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/card.css" />
    <link rel="stylesheet" href="/css/collection.css" />
    <link rel="stylesheet" href="/css/practice.css" />
    <link rel="stylesheet" href="/css/traps.css" />
    <link rel="stylesheet" href="/css/detail.css" />
    <!-- /styles -->
  </head>
  <body>
    <div class="wrap" id="top">
      <!-- build: site header -->

      <!-- RSP-138: one <main> landmark for the tabs, the hint and the three views; the site header and footer stay outside.
           RSP-155: the rubric's own header (enclosure header) is inside <main>, so it is not a second banner. -->
      <main>
        <header class="enclosure-header" data-testid="enclosure-header">
          <div class="brand">
            <h1><a class="home-link" href="#collection">Responsters</a></h1>
            <p id="tagline"></p>
            <div class="dots" aria-hidden="true">
              <i style="background: var(--c1)"></i><i style="background: var(--c2)"></i
              ><i style="background: var(--c3)"></i><i style="background: var(--c4)"></i
              ><i style="background: var(--c5)"></i>
            </div>
          </div>
          <div class="tools">
            <button class="linkbtn" id="howto-open" data-testid="howto-open" aria-controls="howto"></button>
          </div>
        </header>
        <nav class="tabs" role="tablist">
          <button role="tab" id="tab-collection" data-testid="tab-collection" data-view="collection"></button>
          <button role="tab" id="tab-practice" data-testid="tab-practice" data-view="practice"></button>
          <button role="tab" id="tab-traps" data-testid="tab-traps" data-view="traps"></button>
        </nav>

        <section class="howto" id="howto" data-testid="howto" aria-labelledby="howto-title" hidden>
          <h2 id="howto-title"></h2>
          <ol class="path-steps" id="howto-steps" role="list" data-testid="howto-steps"></ol>
          <p class="note" id="howto-note"></p>
          <button class="howto-done" id="howto-close" data-testid="howto-close"></button>
        </section>

        <section class="view" id="view-collection" data-testid="view-collection">
          <div class="progress">
            <span id="mastered"></span>
            <div class="bar"><span id="masterbar"></span></div>
          </div>
          <div class="chips" id="chips"></div>
          <div id="groups"></div>
        </section>

        <section class="view" id="view-practice" data-testid="view-practice" hidden>
          <div class="pbar">
            <h2 class="pbar-title" id="modes-title"></h2>
            <div class="score" id="score"></div>
            <div class="modes" id="modes" role="group" aria-labelledby="modes-title"></div>
          </div>
          <div class="stage" id="stage">
            <div class="prompt" id="prompt" data-testid="question"></div>
            <div class="opts" id="opts"></div>
            <div id="result"></div>
          </div>
        </section>

        <section class="view" id="view-traps" data-testid="view-traps" hidden>
          <p id="traps-lede" style="margin: 0 0 18px; color: var(--muted); max-width: 65ch"></p>
          <div id="pairs"></div>
        </section>

        <button class="linkbtn to-top" id="to-top" data-testid="to-top" type="button"></button>
      </main>
      <!-- build: site footer -->
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
